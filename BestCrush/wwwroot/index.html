<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <title>Best Crush</title>
    <base href="/"/>

    <link href="css/bootstrap.min.css" rel="stylesheet"/>
    <link href="css/bootstrap-icons.min.css" rel="stylesheet">

    <link href="css/app.css" rel="stylesheet"/>
    <link href="BestCrush.styles.css" rel="stylesheet"/>
    <link href="css/character-palette.css" rel="stylesheet"/>
    
    <link href="data:," rel="icon">
</head>

<body class="bestcrush-theme">

<div class="status-bar-safe-area"></div>

<div id="app">
    <div class="w-100 h-100 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-warning" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a class="reload" href="">Reload</a>
    <a class="dismiss">🗙</a>
</div>

<script autostart="false" src="_framework/blazor.webview.js"></script>
<script autostart="false" src="js/popper.min.js"></script>
<script autostart="false" src="js/bootstrap.bundle.min.js"></script>
<script src="js/filter-disclosures.js"></script>

<script>
    const tooltipSelector = '[data-bs-toggle="tooltip"]';
    new bootstrap.Tooltip(document.body, {
        selector: tooltipSelector,
        title(trigger) {
            return trigger.getAttribute('data-bs-title') ?? trigger.getAttribute('title') ?? '';
        }
    });

    function disposeTooltip(trigger) {
        const tooltip = bootstrap.Tooltip.getInstance(trigger);
        if (!tooltip) return;
        if (trigger.hasAttribute('aria-describedby')) {
            trigger.addEventListener('hidden.bs.tooltip', () => tooltip.dispose(), { once: true });
            tooltip.hide();
        } else {
            tooltip.dispose();
        }
    }

    const observer = new MutationObserver(records => {
        for (const record of records) {
            for (const node of record.removedNodes) {
                if (!(node instanceof Element) || node.isConnected) continue;
                if (node.matches(tooltipSelector)) disposeTooltip(node);
                node.querySelectorAll(tooltipSelector).forEach(disposeTooltip);
            }
        }
    });
    observer.observe(document.body, {childList: true, subtree: true});
</script>

</body>
</html>
